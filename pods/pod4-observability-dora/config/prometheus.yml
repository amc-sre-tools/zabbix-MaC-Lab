global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'zabbix-testing'
    env: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - pod4-alertmanager:9093

rule_files:
  - '/etc/prometheus/rules/*.yml'
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['pod3-node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['pod4-cadvisor:8080']

  - job_name: 'pod1-jenkins'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['pod1-jenkins:8080']

  - job_name: 'pod2-zabbix'
    static_configs:
      - targets: ['pod2-zabbix-agent:10050']

  - job_name: 'mysql-exporter'
    static_configs:
      - targets: ['pod4-metrics-exporter:9104']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['pod4-otel-collector:8888', 'pod4-otel-collector:8889']