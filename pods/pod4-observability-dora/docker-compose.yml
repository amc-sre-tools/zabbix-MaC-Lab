services:
  # =============================================================================
  # POD4: Observability DORA - Grafana, Prometheus, Elasticsearch, OTel
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Metrics - Prometheus
  # ---------------------------------------------------------------------------
  pod4-prometheus:
    image: prom/prometheus:latest
    container_name: pod4-observability-prometheus
    hostname: pod4-prometheus
    ports:
      - "9090:9090"
    volumes:
      - pod4-prometheus-data:/prometheus
      - ./pods/pod4-observability-dora/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./pods/pod4-observability-dora/config/prometheus_alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./pods/pod4-observability-dora/config/rules/:/etc/prometheus/rules/:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - pod4-observability-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Metrics - Prometheus Alertmanager
  # ---------------------------------------------------------------------------
  pod4-alertmanager:
    image: prom/alertmanager:latest
    container_name: pod4-observability-alertmanager
    hostname: pod4-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - pod4-alertmanager-data:/alertmanager
      - ./pods/pod4-observability-dora/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - pod4-observability-internal
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Visualization - Grafana
  # ---------------------------------------------------------------------------
  pod4-grafana:
    image: grafana/grafana:latest
    container_name: pod4-observability-grafana
    hostname: pod4-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - pod4-grafana-data:/var/lib/grafana
      - ./pods/pod4-observability-dora/config/grafana/provisioning/:/etc/grafana/provisioning/:ro
      - ./pods/pod4-observability-dora/config/grafana/dashboards/:/var/lib/grafana/dashboards/:ro
    networks:
      - pod4-observability-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Logs - Elasticsearch
  # ---------------------------------------------------------------------------
  pod4-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: pod4-observability-elasticsearch
    hostname: pod4-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.name=pod4-observability
      - node.name=pod4-elasticsearch
    volumes:
      - pod4-elasticsearch-data:/usr/share/elasticsearch/data
      - ./pods/pod4-observability-dora/config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    networks:
      - pod4-observability-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Logs - Kibana
  # ---------------------------------------------------------------------------
  pod4-kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: pod4-observability-kibana
    hostname: pod4-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://pod4-elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
    volumes:
      - ./pods/pod4-observability-dora/config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    networks:
      - pod4-observability-internal
    restart: unless-stopped
    depends_on:
      - pod4-elasticsearch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # Tracing - OpenTelemetry Collector
  # ---------------------------------------------------------------------------
  pod4-otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: pod4-observability-otel-collector
    hostname: pod4-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ./pods/pod4-observability-dora/config/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    networks:
      - pod4-observability-internal
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Metrics Exporters
  # ---------------------------------------------------------------------------
  pod4-cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: pod4-observability-cadvisor
    hostname: pod4-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - pod4-observability-internal
    restart: unless-stopped
    command: --housekeeping_interval=30s --docker_only=true --disable_metrics=percpu,tcp,udp,disk,diskIO,hugetlb,sched,cpu_topology,resctrl --storage_duration=1m0s

  pod4-metrics-exporter:
    image: prom/mysqld-exporter:latest
    container_name: pod4-observability-mysql-exporter
    hostname: pod4-mysql-exporter
    ports:
      - "9104:9104"
    environment:
      DATA_SOURCE_NAME: "pod3-mysql:3306"
    networks:
      - pod4-observability-internal
    restart: unless-stopped

networks:
  pod4-observability-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.40.0/24

volumes:
  pod4-prometheus-data:
  pod4-alertmanager-data:
  pod4-grafana-data:
  pod4-elasticsearch-data: