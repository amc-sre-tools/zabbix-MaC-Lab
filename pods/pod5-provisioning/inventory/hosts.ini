# Ansible Inventory for Zabbix Testing Environment

[pod1-cicd]
pod1-openbao ansible_host=pod1-cicd-internal ansible_connection=podman
pod1-jenkins ansible_host=pod1-cicd-internal ansible_connection=podman
pod1-sonarqube ansible_host=pod1-cicd-internal ansible_connection=podman

[pod2-monitoring]
pod2-postgresql ansible_host=pod2-monitoring-internal ansible_connection=podman
pod2-zabbix-6.0 ansible_host=pod2-monitoring-internal ansible_connection=podman
pod2-zabbix-7.0 ansible_host=pod2-monitoring-internal ansible_connection=podman
pod2-zabbix-7.4 ansible_host=pod2-monitoring-internal ansible_connection=podman

[pod3-services]
pod3-mysql ansible_host=pod3-services-internal ansible_connection=podman
pod3-redis ansible_host=pod3-services-internal ansible_connection=podman
pod3-rabbitmq ansible_host=pod3-services-internal ansible_connection=podman
pod3-nginx ansible_host=pod3-services-internal ansible_connection=podman

[pod4-observability]
pod4-prometheus ansible_host=pod4-observability-internal ansible_connection=podman
pod4-grafana ansible_host=pod4-observability-internal ansible_connection=podman
pod4-elasticsearch ansible_host=pod4-observability-internal ansible_connection=podman

[pod5-provisioning]
pod5-terraform ansible_host=pod5-provisioning-internal ansible_connection=podman
pod5-ansible ansible_host=pod5-provisioning-internal ansible_connection=podman

[all:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3