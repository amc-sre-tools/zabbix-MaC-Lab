# =============================================================================
# SonarQube Project Configuration
# =============================================================================
# Author: Andrés M. Correa
# Project: Zabbix Testing Environment
# =============================================================================

sonar.projectKey=zabbix-testing-environment
sonar.projectName=Zabbix Testing Environment
sonar.projectVersion=1.0.0

sonar.sources=scripts,configs,ansible,pods
sonar.tests=tests

sonar.exclusions=**/node_modules/**,**/vendor/**,**/*.log,docs/diagrams/**
sonar.test.exclusions=**/node_modules/**,**/vendor/**

sonar.sourceEncoding=UTF-8
sonar.language=py,ansible,yaml,shell

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

sonar.coverage.dtdVerification=false
sonar.xml.file.schemas=http://sonarsource.github.io/sonar-scanner-analyzer/analysis-scalastyle.xsl

sonar.security.config.showAdvanced=false