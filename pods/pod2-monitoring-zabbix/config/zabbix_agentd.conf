# Zabbix Agent Configuration for POD2
# Monitoring all Zabbix servers

PidFile=/var/run/zabbix/zabbix_agentd.pid
LogType=console
LogFileSize=100

Server=127.0.0.1,localhost
ServerActive=127.0.0.1:10051
Hostname=zabbix-agent-pod2

# Enable remote commands
EnableRemoteCommands=1
LogRemoteCommands=1

# Performance
RefreshActiveChecks=60
BufferSend=5
BufferSize=100
MaxLinesPerSecond=100

# TLS (configure for production)
# TLSConnect=unencrypted
# TLSAccept=unencrypted

# UserParameter for custom metrics
UserParameter=zabbix.version,/usr/bin/zabbix_get -s localhost -p 10050 -k "agent.version"