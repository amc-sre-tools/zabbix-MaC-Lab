# =============================================================================
# Zabbix Agent Configuration - POD1: CI/CD Services
# =============================================================================
# Monitors: OpenBao, Jenkins, SonarQube, Trivy
# Connects to: Zabbix 6.0, 7.0, 7.4

PidFile=/var/run/zabbix/zabbix_agentd.pid
LogType=console
LogFileSize=100

# Connect to all 3 Zabbix servers
Server=127.0.0.1,pod2-zabbix-6.0-server,pod2-zabbix-7.0-server,pod2-zabbix-7.4-server
ServerActive=pod2-zabbix-6.0-server:10051;pod2-zabbix-7.0-server:10051;pod2-zabbix-7.4-server:10051
Hostname=pod1-cicd-services

# Enable remote commands
EnableRemoteCommands=1
LogRemoteCommands=1

# Performance
RefreshActiveChecks=60
BufferSend=5
BufferSize=100
MaxLinesPerSecond=100

# UserParameters for POD1 services
UserParameter=pod1.openbao.status,curl -sf http://localhost:8200/v1/sys/health >/dev/null && echo 1 || echo 0
UserParameter=pod1.jenkins.status,curl -sf http://localhost:8080/login >/dev/null && echo 1 || echo 0
UserParameter=pod1.sonarqube.status,curl -sf http://localhost:9000/api/system/status 2>/dev/null | grep -q UP && echo 1 || echo 0
UserParameter=pod1.trivy.status,curl -sf http://localhost:4954 >/dev/null && echo 1 || echo 0

# System metrics
UserParameter=system.uptime,cat /proc/uptime | awk '{print int($1)}'
UserParameter=system.cpu.load,cat /proc/loadavg | awk '{print $1}'
UserParameter=system.mem.total,cat /proc/meminfo | grep MemTotal | awk '{print $2}'
UserParameter=system.mem.free,cat /proc/meminfo | grep MemAvailable | awk '{print $2}'