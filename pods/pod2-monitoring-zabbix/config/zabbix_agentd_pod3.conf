# =============================================================================
# Zabbix Agent Configuration - POD3: Services Demo
# =============================================================================
# Monitors: MySQL, Redis, MariaDB, RabbitMQ, Nginx, FastAPI, Node Exporter
# Connects to: Zabbix 6.0, 7.0, 7.4

PidFile=/var/run/zabbix/zabbix_agentd.pid
LogType=console
LogFileSize=100

# Connect to all 3 Zabbix servers
Server=127.0.0.1,pod2-zabbix-6.0-server,pod2-zabbix-7.0-server,pod2-zabbix-7.4-server
ServerActive=pod2-zabbix-6.0-server:10051;pod2-zabbix-7.0-server:10051;pod2-zabbix-7.4-server:10051
Hostname=pod3-services

# Enable remote commands
EnableRemoteCommands=1
LogRemoteCommands=1

# Performance
RefreshActiveChecks=60
BufferSend=5
BufferSize=100
MaxLinesPerSecond=100

# UserParameters for POD3 services
UserParameter=pod3.mysql.status,mysqladmin ping -h localhost -u root -prootpass >/dev/null 2>&1 && echo 1 || echo 0
UserParameter=pod3.redis.status,redis-cli -a redispass ping 2>/dev/null | grep -q PONG && echo 1 || echo 0
UserParameter=pod3.mariadb.status,mysqladmin ping -h localhost -u root -prootpass >/dev/null 2>&1 && echo 1 || echo 0
UserParameter=pod3.rabbitmq.status,curl -sf http://localhost:15672/api/overview >/dev/null && echo 1 || echo 0
UserParameter=pod3.nginx.status,curl -sf http://localhost/ >/dev/null && echo 1 || echo 0
UserParameter=pod3.fastapi.status,curl -sf http://localhost:8000/ >/dev/null && echo 1 || echo 0
UserParameter=pod3.nodeexporter.status,curl -sf http://localhost:9100/metrics >/dev/null && echo 1 || echo 0

# MySQL detailed metrics
UserParameter=mysql.connections, mysql -u root -prootpass -e "SHOW STATUS LIKE 'Threads_connected';" 2>/dev/null | awk 'NR==2{print $2}'
UserParameter=mysql.queries, mysql -u root -prootpass -e "SHOW STATUS LIKE 'Questions';" 2>/dev/null | awk 'NR==2{print $2}'

# Redis metrics
UserParameter=redis.connected,redis-cli -a redispass info 2>/dev/null | grep connected_clients | cut -d: -f2
UserParameter=redis.usedmemory,redis-cli -a redispass info 2>/dev/null | grep used_memory_human | cut -d: -f2

# System metrics
UserParameter=system.uptime,cat /proc/uptime | awk '{print int($1)}'
UserParameter=system.cpu.load,cat /proc/loadavg | awk '{print $1}'
UserParameter=system.mem.total,cat /proc/meminfo | grep MemTotal | awk '{print $2}'
UserParameter=system.mem.free,cat /proc/meminfo | grep MemAvailable | awk '{print $2}'