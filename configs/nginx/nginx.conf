upstream zabbix_6_0 {
    server zabbix-web-6.0:8080;
}

upstream zabbix_7_0 {
    server zabbix-web-7.0:8080;
}

upstream zabbix_7_4 {
    server zabbix-web-7.4:8080;
}

upstream fastapi {
    server fastapi:8000;
}

server {
    listen 80;
    server_name _;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /zabbix6/ {
        proxy_pass http://zabbix_6_0/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /zabbix7/ {
        proxy_pass http://zabbix_7_0/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /zabbix74/ {
        proxy_pass http://zabbix_7_4/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://fastapi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 200 "Zabbix Testing Environment\n\nAvailable endpoints:\n- /zabbix6/ - Zabbix 6.0\n- /zabbix7/ - Zabbix 7.0\n- /zabbix74/ - Zabbix 7.4\n- /api/ - FastAPI\n";
        add_header Content-Type text/plain;
    }
}
