# Description: SonarQube scanner configuration for quality and security analysis
# =============================================================================

sonar.projectKey=zabbix-testing-environment
sonar.projectName=Zabbix Testing Environment
sonar.projectVersion=1.0.0

sonar.sources=scripts,configs,ansible
sonar.tests=tests
sonar.testInclusions=tests/**/*.py
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.jacoco.xmlReportsPath=coverage.xml

sonar.sourceEncoding=UTF-8
sonar.language=py,shell,yaml,dockerfile

sonar.securityExclusions=tests/**,.git/**,*.md

sonar.cpd.skip=true

sonar.python.version=3.11

sonar.issues.console.export=true
sonar.issues.console.upload=true
